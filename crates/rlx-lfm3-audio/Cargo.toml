[package]
name = "rlx-lfm3-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "LiquidAI LFM3-Audio-2B (GGUF): speech recognition, speech synthesis and spoken chat — LFM3 backbone, LFM2 speech encoder, MaskGIT depth decoder and Liquid codec as rlx graphs"
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow = { workspace = true }
half = { workspace = true }
rlx-core = { workspace = true }
rlx-cli = { workspace = true }
rlx-flow = { workspace = true }
rlx-gguf = { workspace = true }
rlx-ir = { workspace = true }
rlx-runtime = { workspace = true }
rustfft = "6"

[dev-dependencies]
serde_json = { workspace = true }

[[bin]]
name = "rlx-lfm3-audio"
path = "src/bin/rlx_lfm3_audio.rs"

[features]
default = ["tokenizer"]
# Text prompts and transcripts; without it the CLI takes and prints token ids.
tokenizer = ["rlx-core/tokenizer"]
metal = ["rlx-runtime/metal"]
mlx = ["rlx-runtime/mlx"]
cuda = ["rlx-runtime/cuda"]
rocm = ["rlx-runtime/rocm"]
gpu = ["rlx-runtime/gpu"]
vulkan = ["rlx-runtime/vulkan"]
# Apple Neural Engine (`Device::Ane`) and Google TPU (`Device::Tpu`, libtpu via
# PJRT): opt-in, outside `all-backends`, like the rest of the workspace.
coreml = ["rlx-runtime/coreml", "rlx-core/coreml"]
tpu = ["rlx-runtime/tpu", "rlx-core/tpu"]
# WebGL2 (`Device::OpenGl`); natively it runs the WebGL planner on the CPU.
webgl = ["rlx-runtime/opengl"]
all-backends = ["metal", "mlx", "cuda", "rocm", "gpu", "vulkan"]
apple-silicon = ["metal", "mlx", "coreml"]
nvidia-gpu = ["cuda"]
amd-gpu = ["rocm"]

[lints]
workspace = true
