[package]
name = "rlx-moonshine-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "no_std int8/int4 Moonshine v2 streaming ASR (moonshine-streaming-tiny) for MCUs: frame frontend, windowed encoder, KV-cached decoder, no allocator"
keywords.workspace = true
categories.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = ["std"]
# Host-side model writer (via rlx-mcu). Inference never needs it.
std = ["rlx-mcu/std"]
# Arm DSP-extension int8 kernels (Cortex-M4/M7/M33); same bits as without.
dsp = ["rlx-mcu/dsp"]

[dependencies]
rlx-mcu = { workspace = true }
libm = { version = "0.2", default-features = false }

[lints]
workspace = true
