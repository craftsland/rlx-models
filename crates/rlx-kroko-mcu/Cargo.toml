[package]
name = "rlx-kroko-mcu"
version = "0.2.19"
edition = "2024"
license = "GPL-3.0-only"
publish = false
description = "Bare-metal RISC-V firmware running Kroko streaming Zipformer2 speech recognition on rlx-kroko-core, layers paged as from NAND"

# Deliberately outside the workspace (listed in its `exclude`), like
# rlx-ten-vad-mcu: a bare-metal target with its own linker script and profile.

[dependencies]
rlx-kroko-core = { path = "../rlx-kroko-core", default-features = false }

[[bin]]
name = "kroko-mcu"
path = "src/main.rs"
test = false
bench = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false
