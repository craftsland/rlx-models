[build]
# nRF54H20 application core: Cortex-M33 with FPU and the DSP extension.
target = "thumbv8m.main-none-eabihf"

[target.thumbv8m.main-none-eabihf]
rustflags = ["-C", "target-cpu=cortex-m33", "-C", "link-arg=-Tlink.x"]
# QEMU's MPS2 AN505 is a Cortex-M33 board; link.x maps the nRF54H20's memories
# onto it. Semihosting carries the output and the exit code.
runner = "qemu-system-arm -machine mps2-an505 -nographic -semihosting-config enable=on,target=native -kernel"
